spring.application.name=lotus

jwt.secret=${JWT_SECRET}
jwt.expiration=64800000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

cors.allowed.origins=${CORS_ALLOWED_ORIGINS}

supabase.s3.endpoint=${SUPABASE_S3_ENDPOINT}
supabase.s3.access-key=${SUPABASE_ACCESS_KEY}
supabase.s3.secret-key=${SUPABASE_SECRET_KEY}
supabase.s3.bucket=${SUPABASE_BUCKET}
supabase.s3.region=${SUPABASE_REGION}
supabase.storage.public-url=${SUPABASE_STORAGE_PUBLIC_URL}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

management.endpoints.web.exposure.include=health

